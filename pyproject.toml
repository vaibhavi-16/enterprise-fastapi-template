[project]
name = "enterprise-fastapi-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vaibhavi-16", email = "tandon16vaibhavi@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.141.1",
    "passlib>=1.7.4",
    "psycopg>=3.3.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "python-jose>=3.5.0",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.52.1",
]

[project.scripts]
enterprise-fastapi-template = "enterprise_fastapi_template:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
]
